name: Validate Agents & Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run gitleaks scan (PR-compatible)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-doctor:
    name: Run Doctor Checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Run doctor
        run: npm run doctor

  validate-risk-path:
    name: Validate Risk-Scored Review Path
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Determine changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          else
            BEFORE_SHA="${{ github.event.before }}"
            AFTER_SHA="${{ github.sha }}"
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > changed-files.txt
            else
              git show --pretty="" --name-only "$AFTER_SHA" > changed-files.txt
            fi
          fi

      - name: Write PR body snapshot
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf "%s" "${PR_BODY:-}" > pr-body.txt

      - name: Assess risk path (advisory)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/assess-risk-path.js --changed-files-file changed-files.txt --pr-body-file pr-body.txt --require-ack --advisory
          else
            node scripts/assess-risk-path.js --changed-files-file changed-files.txt --advisory
          fi

  validate-agent-evals:
    name: Validate Agent Eval Harness
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Run agent eval harness
        run: npm run eval:agents

      - name: Generate agent eval JSON report
        run: npm run eval:agents:json

      - name: Generate agent eval trend snapshot
        run: npm run eval:agents:trend

      - name: Upload agent eval artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-eval-reports
          path: |
            evals/reports/latest.json
            evals/reports/trend-summary.md
          if-no-files-found: error

      - name: Run agent eval harness tests
        run: node scripts/eval-harness.test.js

  lint-workflows:
    name: Lint GitHub Workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      # actionlint is pinned to a specific release; the Go module proxy verifies its checksum.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11

      - name: Lint workflows with actionlint
        run: |
          GOPATH="$(go env GOPATH)"
          "$GOPATH/bin/actionlint"

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [secrets-scan, validate-doctor, validate-risk-path, validate-agent-evals, lint-workflows]
    if: always()

    steps:
      - name: Check validation results
        env:
          SECRETS_RESULT: ${{ needs.secrets-scan.result }}
          DOCTOR_RESULT: ${{ needs.validate-doctor.result }}
          RISK_PATH_RESULT: ${{ needs.validate-risk-path.result }}
          AGENT_EVAL_RESULT: ${{ needs.validate-agent-evals.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.lint-workflows.result }}
        run: |
          echo "Secret Scan: ${SECRETS_RESULT}"
          echo "Doctor Checks: ${DOCTOR_RESULT}"
          echo "Risk Path Validation (advisory): ${RISK_PATH_RESULT}"
          echo "Agent Eval Harness: ${AGENT_EVAL_RESULT}"
          echo "Workflow Linting: ${WORKFLOW_LINT_RESULT}"

          if [ "${SECRETS_RESULT}" != "success" ] || \
             [ "${DOCTOR_RESULT}" != "success" ] || \
             [ "${AGENT_EVAL_RESULT}" != "success" ] || \
             [ "${WORKFLOW_LINT_RESULT}" != "success" ]; then
            echo "::error::One or more validation checks failed"
            exit 1
          fi

          echo "✅ All validation checks passed!"
