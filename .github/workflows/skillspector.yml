name: SkillSpector

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan Skills
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install SkillSpector
        run: pip install 'skillspector @ git+https://github.com/NVIDIA/SkillSpector@c7958a3268d9498644b22edb75d0f051bbc8cbfc' # v2.12.0

      # Single job: 28 skills scan in seconds while the pip install dominates,
      # so sharding would duplicate the install-per-shard and run slower.
      # No --max-skills on the v2.12.0 release; its built-in cap is 32 skills.
      # --fail-on-incomplete is omitted: v2.12.0 reports unresolved path-like
      # prose as partial, so the flag would fail every run.
      - name: Scan skills
        run: >-
          skillspector scan .opencode/skills --recursive --no-llm
          --format sarif --output skillspector.sarif --fail-on-findings

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skillspector-sarif
          path: skillspector.sarif
          retention-days: 30
