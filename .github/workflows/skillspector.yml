name: SkillSpector

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan Skills
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install SkillSpector
        run: pip install 'skillspector @ git+https://github.com/NVIDIA/SkillSpector@c7958a3268d9498644b22edb75d0f051bbc8cbfc' # v2.12.0

      # Single job: 28 skills scan in seconds while the pip install dominates,
      # so sharding would duplicate the install-per-shard and run slower.
      # No --max-skills on the v2.12.0 release; its built-in cap is 32 skills.
      # --fail-on-incomplete is omitted: v2.12.0 reports unresolved path-like
      # prose as partial, so the flag would fail every run.
      - name: Scan skills
        run: >-
          skillspector scan .opencode/skills --recursive --no-llm
          --format json --output skillspector.json --fail-on-findings

      - name: Enforce score
        if: always()
        run: |
          set -o pipefail
          if [ ! -f skillspector.json ]; then
            echo "No SkillSpector report; the scan failed before writing it." >&2
            exit 1
          fi
          # Score is confidence-weighted; --fail-on-findings covers zero-point hits.
          node -e '
            const r = require("./skillspector.json");
            const score = r.max_risk_score;
            const findings = (r.skills ?? []).reduce((n, s) => n + (s.finding_count || 0), 0);
            console.log("SkillSpector score: " + score + "/100, findings: " + findings);
            if (score !== 0) {
              console.error("Score changed from 0 to " + score + "; failing the gate.");
              process.exit(1);
            }
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write scan summary
        if: always()
        run: |
          {
            echo "## SkillSpector scan"
            echo
            skillspector scan .opencode/skills --recursive --no-llm --format markdown | head -c 900000
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skillspector-report
          path: skillspector.json
          if-no-files-found: ignore
          retention-days: 30
